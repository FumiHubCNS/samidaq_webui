
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>SAMIDARE Control Panel</title>
  <link rel="stylesheet" href="assets/index.css" />
</head>

<body>
  <h1>SAMIDARE Control Panel</h1>
  <p>
    Control SAMDAQ using FastAPI (<code>/api/samidare/run</code>)
    <br />
    Current time: <span id="currentTime">--</span>
  </p>

  <div class="grid">
    <div class="card wide-card">
      <h2>Status</h2>
      <table class="status-table">
        <tbody id="statusTable">
          <tr><td colspan="2">Loading status...</td></tr>
        </tbody>
      </table>
    </div>


  <div class="card wide-card">
    
    <h2>Setting</h2>

    <div class="form-row">
      <label>Board Connection</label>
      <button onclick="runFunction('connect_board')">Connect</button>
      <button class="secondary" onclick="runFunction('disconnect_board')">Disconnect</button>
    </div>
    
    <div class="form-row">
      <label>Power</label>
      <button onclick="runFunction('power_on')">Power On</button>
      <button class="secondary" onclick="runFunction('power_off')">Power Off</button>
    </div>

    <div class="form-row">
      <label>Trigger Type</label>
      <button onclick="setTriggerType()">Set</button>
      <select id="triggerType">
        <option value="self">self</option>
        <option value="external">external</option>
        <option value="1khz">1kHz</option>
        <option value="1mhz">1MHz</option>
      </select>
    </div>

    <div class="form-row">
      <label>Trigger Threshold</label>
      <button onclick="setTriggerThreshold()">Set</button>
      <input id="triggerThreshold" type="number" min="0" max="1023" value="0" />
    </div>

    <div class="form-row">
      <label>Polarity</label>
      <button onclick="setPolarity()">Set</button>
      <select id="polarity">
        <option value="positive">positive</option>
        <option value="negative">negative</option>
      </select>

    </div>

    <div class="form-row">
      <label>Gain</label>
      <button onclick="setGain()">Set</button>
      <select id="gain">
        <option value="1">1 = 30mV / 160ns</option>
        <option value="2">2 = 20mV / 160ns</option>
        <option value="3">3 = 4mV / 300ns</option>
      </select>
    </div>


    <div class="form-row">
      <label>Samples</label>
      <button onclick="setSamples()">Set</button>
      <select id="samples">
        <option value="16">16</option>
        <option value="32">32</option>
        <option value="64" selected>64</option>
        <option value="128">128</option>
      </select>
    </div>

    <div class="form-row">
      <label>Pre Samples</label>
      <button onclick="setPreSamples()">Set</button>
      <select id="preSamples">
        <option value="0">0</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>
    </div>

    <div class="form-row">
      <label>External Clock</label>
      <button onclick="setExternalClk()">Set</button>
      <select id="externalClk">
        <option value="true">on</option>
        <option value="false">off</option>
      </select>
    </div>
  
    <div class="form-row">
      <label>Output Directory</label>
      <button onclick="setOutputDir()">Set</button>
      <input id="outputDir" type="text" value="/home/daq/samidare/SAM_DAQ" />
    </div>

    <div class="form-row">
      <label>Output Filename</label>
      <button onclick="setOutputFile()">Set</button>
      <input id="outputFile" type="text" value="output/output" />
    </div>


    <div class="form-row-all">
      <label>All Settings</label>
      <button class="note" onclick="setAll()">Set All</button>
    </div>
    
  </div>


    <div class="card wide-card">
      <h2>DAQ</h2>

      <div class="data-name-table">
        <label for="dataNameIncrementMode">Increment</label>
        <label for="lockRunNameNumber">Lock</label>
        <label for="runName">Run Name</label>
        <label for="runNumber">Run Number</label>
        

        <input
          id="dataNameIncrementMode"
          type="checkbox"
          onchange="updateDataNameStateFromPage()"
        />

        <input
          id="lockRunNameNumber"
          type="checkbox"
          onchange="updateRunNameNumberLock()"
        />

        <input
          id="runName"
          type="text"
          value="run"
          onchange="updateDataNameStateFromPage()"
        />

        <input
          id="runNumber"
          type="number"
          value="0"
          min="0"
          onchange="updateDataNameStateFromPage()"
        />
      </div>

      <label>Header Comment</label>
      <input
        id="headerComment"
        type="text"
        placeholder="Header comment"
      />

      <label>Ender Comment</label>
      <input
        id="enderComment"
        type="text"
        placeholder="Ender comment"
      />

      <button onclick="startDaq()">Start DAQ</button>
      <button class="secondary" onclick="stopDaq()">Stop DAQ</button>


      <h2>Output File Monitor</h2>
        <table class="status-table">
          <tbody>
            <tr>
              <th>File</th>
              <td id="fileMonitorPath">No status yet</td>
            </tr>
            <tr>
              <th>Exists</th>
              <td id="fileMonitorExists">--</td>
            </tr>
            <tr>
              <th>Total Size</th>
              <td id="fileMonitorSize">--</td>
            </tr>
            <tr>
              <th>Increase / sec</th>
              <td id="fileMonitorIncrease">--</td>
            </tr>
          </tbody>
        </table>

      <h2>Quit SAMDAQ</h2>
      <button onclick="startSAMDaq()">Start SAMDAQ</button>
      <button class="secondary" onclick="runFunction('quit_daq')">Quit SAMDAQ</button>
      <button class="note" onclick="restartSAMDaq()">Restart SAMDAQ</button>
      
    </div>


    <div class="card wide-card">
      <h2>Custom Command</h2>

      <label>SAMDAQ Command</label>
      <input
        id="customCommand"
        type="text"
        value="status"
        placeholder="e.g. status, ping, read 0x00"
      />

      <button onclick="sendCustomCommand()">Send Command</button>
    </div>

  </div>

  <h2>Response</h2>
  <pre id="response">No response yet</pre>

  <script src="assets/index.js"></script>
  
</body>
</html>
